[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-canary"
version = "0.1.0"
description = "Fail-loud local risk inspection for scheduled jobs"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jason Caston"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cron-canary = "cron_canary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
